<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BetAppist • Live Football</title><link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="bg"><i></i><i></i><i></i></div>
<header class="topbar">
  <div class="logo"><span class="pulse"></span>BET<span>APP</span>IST</div>
  <div class="live"><b></b> CANLI VERİ</div>
  <button class="refresh" onclick="loadMatches()">↻ Güncelle</button>
</header>
<main>
  <section class="welcome">
    <div><p class="eyebrow">FOOTBALL INTELLIGENCE</p><h1>Maçları <span>tek ekranda</span> takip et.</h1><p class="muted">Canlı skorlar, yaklaşan maçlar ve oranlar.</p></div>
    <div class="clock" id="clock">--:--:--</div>
  </section>
  <section class="stats">
    <div class="stat"><small>TOPLAM MAÇ</small><strong id="total">0</strong><em>veritabanında</em></div>
    <div class="stat"><small>CANLI</small><strong id="liveCount">0</strong><em class="green">● aktif</em></div>
    <div class="stat"><small>BUGÜN</small><strong id="today">0</strong><em>maç</em></div>
    <div class="stat"><small>SON GÜNCELLEME</small><strong id="updated">--:--</strong><em>otomatik</em></div>
  </section>
  <section class="toolbar">
    <div class="tabs"><button class="tab active" data-filter="all">Tümü</button><button class="tab" data-filter="live">● Canlı</button><button class="tab" data-filter="today">Bugün</button><button class="tab" data-filter="upcoming">Yaklaşan</button></div>
    <input id="search" placeholder="⌕  Takım ara..." oninput="render()">
  </section>
  <div id="notice" class="notice">Veriler hazırlanıyor...</div>
  <section id="matches" class="matches"></section>
</main>
<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="modalbox"><button class="x" onclick="closeModal()">×</button><div id="detail"></div></div></div>
<script>
let all=[],filter='all';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function isLive(m){return ['live','in-play','in_play'].includes((m.status||'').toLowerCase())}
function isToday(m){if(!m.kickoff_at)return false;return new Date(m.kickoff_at).toDateString()===new Date().toDateString()}
function isUpcoming(m){return m.kickoff_at&&new Date(m.kickoff_at)>new Date()&&!isLive(m)}
function time(m){return m.kickoff_at?new Date(m.kickoff_at).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'}):'--:--'}
function date(m){return m.kickoff_at?new Date(m.kickoff_at).toLocaleDateString('tr-TR',{day:'2-digit',month:'short'}):'Tarih yok'}
async function loadMatches(){
 document.getElementById('notice').textContent='● Veriler yenileniyor...';
 try{const r=await fetch('/api/matches');if(!r.ok)throw Error('API '+r.status);all=await r.json();
 document.getElementById('total').textContent=all.length;document.getElementById('liveCount').textContent=all.filter(isLive).length;document.getElementById('today').textContent=all.filter(isToday).length;document.getElementById('updated').textContent=new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
 document.getElementById('notice').textContent=all.length?'● Sistem aktif • '+all.length+' maç yüklendi':'Henüz maç verisi yok. Scraper çalıştırılınca burada görünecek.';render();
 }catch(e){document.getElementById('notice').textContent='⚠ Veri alınamadı: '+e.message}}
function render(){
 const q=document.getElementById('search').value.toLowerCase();
 let data=all.filter(m=>(filter==='all'||(filter==='live'&&isLive(m))||(filter==='today'&&isToday(m))||(filter==='upcoming'&&isUpcoming(m)))&&((m.home_team||'')+' '+(m.away_team||'')).toLowerCase().includes(q));
 data.sort((a,b)=>new Date(a.kickoff_at||0)-new Date(b.kickoff_at||0));
 document.getElementById('matches').innerHTML=data.length?data.map(m=>`<article class="match ${isLive(m)?'is-live':''}" onclick="openMatch(${m.id})">
 <div class="mhead"><span class="league">ENGLAND • PREMIER LEAGUE</span><span class="${isLive(m)?'badge livebadge':'badge'}">${isLive(m)?'● CANLI':date(m)}</span></div>
 <div class="teams"><div class="team"><span class="crest">⚽</span><b>${esc(m.home_team)}</b></div><div class="center"><strong>${m.home_score??'–'} : ${m.away_score??'–'}</strong><small>${time(m)}</small></div><div class="team away"><b>${esc(m.away_team)}</b><span class="crest">⚽</span></div></div>
 <div class="mfoot"><span>Round ${m.round??'–'}</span><span>${esc(m.status||'scheduled')}</span><span class="open">Detay →</span></div>
 </article>`).join(''):'<div class="empty"><div>⚽</div><h3>Maç bulunamadı</h3><p>Filtreyi veya takım aramasını değiştir.</p></div>';
}
function openMatch(id){const m=all.find(x=>x.id===id);if(!m)return;document.getElementById('detail').innerHTML=`<p class="eyebrow">MATCH DETAIL</p><h2>${esc(m.home_team)} <span>vs</span> ${esc(m.away_team)}</h2><div class="bigscore">${m.home_score??'–'} <i>:</i> ${m.away_score??'–'}</div><div class="detailrow"><span>Başlangıç</span><b>${m.kickoff_at?new Date(m.kickoff_at).toLocaleString('tr-TR'):'—'}</b></div><div class="detailrow"><span>Durum</span><b>${esc(m.status||'scheduled')}</b></div><div class="detailrow"><span>Round</span><b>${m.round??'—'}</b></div>`;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;render()});
setInterval(()=>document.getElementById('clock').textContent=new Date().toLocaleTimeString('tr-TR'),1000);
setInterval(loadMatches,30000);loadMatches();
</script>
</body></html>
